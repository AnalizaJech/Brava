<div class="min-h-screen px-4 py-8 text-white">
  <!-- Encabezado -->
  <div class="flex justify-between items-center mb-8">
    <div class="flex items-center gap-3 text-cyan-400">
      <div class="bg-cyan-500/20 p-4 rounded-full border border-cyan-400/40 shadow-md">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-cyan-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 3h2l.4 2M7 13h11l3-6H6.4M7 13L5.2 20H19a1 1 0 0 0 1-1l1-4M9 22a1 1 0 100-2 1 1 0 000 2zm8 0a1 1 0 100-2 1 1 0 000 2" />
        </svg>
      </div>
      <span class="text-2xl font-bold">JechCommerce</span>
    </div>

    <div class="text-right">
      <h2 class="text-3xl font-bold text-cyan-200">Productos</h2>
      <p class="text-cyan-100 text-sm">Gestiona tu inventario de productos</p>
    </div>
  </div>

  <!-- Filtros y botón -->
  <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
    <!-- Filtro de Producto -->
    <div class="relative w-full sm:max-w-md">
      <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400">
        <!-- Icono lupa -->
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
          <path d="M21 21l-6 -6" />
        </svg>
      </span>
      <input
        type="text"
        [(ngModel)]="busqueda"
        (input)="buscarProductos()"
        class="w-full pl-10 pr-4 py-2 rounded-lg bg-gray-700 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all"
        placeholder="Buscar productos..."
      />
    </div>

    <!-- Botón nuevo producto -->
    <button
      routerLink="/admin/crear-producto"
      class="bg-cyan-400 hover:bg-cyan-500 text-gray-900 font-bold py-2 px-4 rounded-xl shadow-lg cursor-pointer"
    >
      Nuevo Producto
    </button>
  </div>

  <!-- Tabla de productos -->
  <div class="overflow-auto rounded-xl shadow border border-white/20 bg-white/5 backdrop-blur-xl">
    <table class="min-w-full text-sm text-left">
      <thead class="bg-cyan-500/10 text-cyan-200">
        <tr>
          <th class="px-4 py-3">Producto</th>
          <th class="px-4 py-3">Precio</th>
          <th class="px-4 py-3">Stock</th>
          <th class="px-4 py-3 text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let producto of paginatedProducts" class="border-b border-white/10 hover:bg-white/10">
          <td class="px-4 py-2">{{ producto.nom_producto }}</td>
          <td class="px-4 py-2">S/. {{ producto.precio_final | number:'1.2-2' }}</td>
          <td class="px-4 py-2">{{ producto.stock }}</td>
          <td class="px-4 py-2 text-center">
            <!-- Editar -->
            <button (click)="editarProducto(producto)" class="text-yellow-400 hover:text-yellow-500 cursor-pointer mr-2 transition-all">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4" />
                <path d="M13.5 6.5l4 4" />
              </svg>
            </button>

            <!-- Eliminar -->
            <button (click)="eliminarProducto(producto.id_producto)" class="text-red-500 hover:text-red-600 cursor-pointer transition-all">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 002 2h8a2 2 0 002-2l1-12M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3" />
              </svg>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Paginación -->
  <div class="flex justify-between mt-6" *ngIf="productos.length > pageSize">
    <button
      (click)="changePage(page - 1)"
      [disabled]="page === 1"
      class="cursor-pointer bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg transition disabled:opacity-50"
    >
      ← Anterior
    </button>
    <button
      (click)="changePage(page + 1)"
      [disabled]="page * pageSize >= productos.length"
      class="cursor-pointer bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg transition disabled:opacity-50"
    >
      Siguiente →
    </button>
  </div>
</div>
